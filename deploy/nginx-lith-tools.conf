# =============================================================================
#  Lith Tools 站点反向代理配置示例（宝塔 / 小皮面板的 Nginx 站点可直接用）
#
#  ⚠ 本文件只适用于「Nginx / 面板反代」路线：服务监听 127.0.0.1:8787。
#     直接用 IP:端口 访问时不需要本文件，应把 deploy/panel.env 的 HOST 改成 0.0.0.0。
#
#  用法（宝塔面板）：
#    网站 → 你的站点 → 反向代理 → 添加反向代理
#      代理名称：lith-tools    目标 URL：http://127.0.0.1:8787
#      发送域名：$host
#    然后到「配置文件」里补上下面的 client_max_body_size / proxy_read_timeout
#
#  用法（小皮面板 / 手工 Nginx）：
#    把下面的 server { } 内容合并到站点配置的 server { } 里
# =============================================================================

server {
    listen 80;
    server_name tools.example.com;          # ← 换成你的域名

    # 站点请求体上限（Lith Tools 服务端上限 2MB）
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # 长响应 / 下载不被反代缓冲截断
        proxy_buffering off;
    }

    # 健康检查（面板监控 / 负载均衡可探测）
    location = /api/health {
        proxy_pass http://127.0.0.1:8787/api/health;
        access_log off;
    }
}
