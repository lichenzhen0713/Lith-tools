services:
  lith-tools:
    build: .
    image: lith-tools:2.0.0
    container_name: lith-tools
    restart: unless-stopped
    init: true
    ports:
      - "8787:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      DB_PATH: /app/data/lith-tools.db
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8787}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123456}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-chat}
      DEEPSEEK_REASONING_MODEL: ${DEEPSEEK_REASONING_MODEL:-deepseek-reasoner}
      LCZOJ_BASE_URL: ${LCZOJ_BASE_URL:-}
      LCZOJ_CLIENT_ID: ${LCZOJ_CLIENT_ID:-}
      LCZOJ_CLIENT_SECRET: ${LCZOJ_CLIENT_SECRET:-}
      LCZOJ_REDIRECT_URI: ${LCZOJ_REDIRECT_URI:-}
      LCZOJ_NAME: ${LCZOJ_NAME:-LCZOJ}
      # 本地 HTTP 测试默认 false；正式 HTTPS 部署请设为 true
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
