name: ✨ 功能建议
description: 提出新工具、新能力或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请先搜索现有 Issue，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 使用场景 / 要解决的问题
      description: 你在什么情况下需要这个功能？
      placeholder: 当我 ... 时，我希望 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你期望它如何工作？是否有参考实现？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过哪些替代做法？
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 类型
      options:
        - 新增工具
        - 改进现有工具
        - 博客 / 论坛
        - 管理后台
        - 账户 / 安全
        - 部署 / 工程化
        - 文档
        - 其他

  - type: checkboxes
    id: contribution
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
          required: false
        - label: 我可以帮助测试或补充文档
          required: false
