name: 🐛 Bug 报告
description: 报告一个可复现的问题，帮助我们改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量提供可复现的信息。
        安全问题请勿在此公开，请按仓库 `docs/SECURITY.md` 中的说明私下报告。

  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 发生了什么？你期望发生什么？
      placeholder: 简要描述问题与期望行为
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 看到 ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 包括错误信息、状态码或截图
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 环境
      description: Node.js 版本、操作系统、浏览器、数据库是否重置
      placeholder: Node 24.19 / Windows 11 / Chrome 141 / 本地开发
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      multiple: true
      options:
        - 工具页面
        - 账户 / 注册登录
        - 博客
        - 论坛
        - 管理后台
        - 邮件 / 通知
        - 部署 / 构建
        - 文档
        - 其他

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 服务端日志（`journalctl -u lith-tools` 或 `server.log`）、浏览器控制台错误、截图
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复问题
          required: true
        - label: 我已尝试使用最新版本复现
          required: true
