<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 120" width="128" height="120" role="img" aria-label="Lith Tools">
  <defs>
    <linearGradient id="ltBrackets" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="55%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ltMonogram" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>

  <!-- 代码括号：代表工具与开发者生态 -->
  <path d="M46 30 L22 58 L46 86" fill="none" stroke="url(#ltBrackets)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M82 30 L106 58 L82 86" fill="none" stroke="url(#ltBrackets)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 中央 L 字母：Lith 的首字母，构成工具箱的把手 -->
  <path d="M60 38 V74 H82" fill="none" stroke="url(#ltMonogram)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 三个圆点：工具、内容、社区 -->
  <circle cx="40" cy="104" r="5" fill="#4F46E5"/>
  <circle cx="64" cy="104" r="5" fill="#06B6D4"/>
  <circle cx="88" cy="104" r="5" fill="#22C55E"/>
</svg>
